name: BTP Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android NDK r28c
        run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure CMake
        run: |
          cmake -S . -B build-arm64-v8a -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28

      - name: Build Release
        run: cmake --build build-arm64-v8a --target BTPClient --parallel

      - name: Verify BTP.so
        shell: bash
        run: |
          test -f build-arm64-v8a/BTP.so
          file build-arm64-v8a/BTP.so
          readelf -h build-arm64-v8a/BTP.so | grep -E 'Class:.*ELF64|Machine:.*AArch64'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BTP-arm64-v8a
          path: |
            build-arm64-v8a/BTP.so
